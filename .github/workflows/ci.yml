name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: lint · tests · reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Lint
        run: python -m ruff check .

      - name: Benchmark datasets are reproducible
        # the committed datasets are the exam this project is scored against, so
        # regenerating them must be byte-identical or the numbers mean nothing
        run: |
          python scripts/make_datasets.py
          git diff --exit-code -- data/

      - name: Tests
        run: python -m pytest -q

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Frontend tests
        # Node's built-in runner over the same ES modules the browser loads.
        # No dependencies, no lockfile, no node_modules — the "no build step"
        # promise holds, and the money formatter is no longer only checked by
        # someone looking at a screen.
        # Via npm so the file list lives in web/package.json and nowhere
        # else. Not `node --test web/tests/`: Node 24 no longer walks a
        # directory given to --test, it tries to load it as a module.
        run: npm test --prefix web

      - name: Every frontend test file is actually in that list
        # An explicit file list cannot walk a directory, so a new test file
        # would sit there passing zero assertions and nobody would know. This
        # is the one failure a test suite cannot report on itself.
        run: |
          on_disk=$(ls web/tests/*.test.js | xargs -n1 basename | sort | tr '
' ' ')
          in_script=$(node -p "require('./web/package.json').scripts.test"             | tr ' ' '
' | grep '\.test\.js$' | xargs -n1 basename | sort | tr '
' ' ')
          echo "on disk:   $on_disk"
          echo "in script: $in_script"
          test "$on_disk" = "$in_script"

      - name: Held-out accuracy gate
        # fails the build if generalisation regresses, so the README's numbers
        # cannot silently drift away from reality
        run: python -m pytest -q tests/test_evaluate.py

      - name: CLI smoke
        run: |
          python scripts/run_reconciliation.py --dataset messy --out out/
          test -s out/reconciliation.json
          test -s out/exceptions.csv
          test -s out/audit.jsonl

  docker:
    name: docker build · run · reconcile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build -t finance-controller .

      - name: Run and verify a real reconciliation over HTTP
        run: |
          docker run -d -p 8000:8000 --name fc finance-controller
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8000/api/health >/dev/null && break || sleep 1
          done
          curl -fsS http://localhost:8000/api/health
          curl -fsS -X POST http://localhost:8000/api/reconcile \
            -H 'content-type: application/json' -d '{"dataset":"realistic"}' \
            | python -c "import sys, json; m = json.load(sys.stdin)['metrics']; \
                assert m['precision'] == 1.0 and m['recall'] == 1.0, m; \
                print('reconciled OK:', m['total_entries'], 'entries')"

      - name: Server logs
        if: always()
        run: docker logs fc || true

      - name: Clean up
        if: always()
        run: docker rm -f fc || true
