# Render.com blueprint — one-click deploy of the API + dashboard.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: ai-finance-controller
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    plan: free
    envVars:
      # Where the exception queue lives. On the free plan this path is inside
      # the container's ephemeral filesystem, so the worklist — notes,
      # assignees, resolution reasons — is LOST on every restart and redeploy.
      # The reconciliation engine is unaffected: it is deterministic and holds
      # no state, so re-running a month reproduces the same result exactly.
      # Only the human's work is lost.
      #
      # To make the queue durable, move to a paid instance and uncomment the
      # `disk:` block below; the path here already points at its mount.
      - key: RECON_DB_PATH
        value: /var/data/reconciliation.db

      # optional — without these the residual resolver runs its heuristic fallback
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_MODEL
        value: claude-sonnet-5
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET

      # Optional, and strongly recommended for a public URL. Set it here and
      # every state-changing request -- running a reconciliation, closing an
      # exception, adding a note -- must send it as the X-API-Token header.
      # Reads stay open, so the dashboard is still shareable read-only.
      # Leave unset and anyone with the link can edit the worklist.
      - key: RECON_API_TOKEN
        sync: false
        sync: false

    # Durable state. Render disks require a paid instance type, so this is left
    # commented rather than shipped broken: a blueprint that fails to deploy on
    # the plan it declares is worse than one that deploys with a stated limit.
    #
    # disk:
    #   name: recon-data
    #   mountPath: /var/data
    #   sizeGB: 1
